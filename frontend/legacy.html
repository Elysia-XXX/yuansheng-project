<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小熊电器 · 客诉分析系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
            },
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            card: '0 1px 3px 0 rgb(0 0 0 / 0.04), 0 4px 12px -2px rgb(0 0 0 / 0.06)',
            dropdown: '0 10px 24px -4px rgb(0 0 0 / 0.08)',
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --brand-500: #f97316;
      --brand-600: #ea580c;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    .nav-item.active {
      background-color: #fff7ed;
      color: #c2410c;
      font-weight: 600;
    }
    .nav-item.active svg { color: #f97316; }
    .nav-item:focus-visible { outline: 2px solid #f97316; outline-offset: -2px; }
    .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #f97316; outline-offset: 2px; }
    .chart-container { position: relative; height: 320px; width: 100%; }
    .chart-container-sm { position: relative; height: 240px; width: 100%; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #475569;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.04);
      cursor: pointer;
      user-select: none;
    }
    .chip:hover:not(.chip-active) { border-color: #fdba74; color: #c2410c; background: #fff7ed; box-shadow: 0 2px 6px -1px rgb(249 115 22 / 0.12); }
    .chip-active {
      background: linear-gradient(135deg, #ff963f 0%, #ff7417 100%);
      color: #ffffff;
      border-color: #ff7417;
      box-shadow: 0 7px 16px -4px rgb(255 116 23 / 0.34);
    }
    .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; transition: background 0.2s ease; }
    .chip-active .chip-dot { background: #ffffff; }
    .chip-row-label { font-size: 0.875rem; font-weight: 500; color: #64748b; margin-right: 0.5rem; }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ===== Semantic tag tree ===== */
    .tag-tree{font-size:13px;}
    .tag-group{margin:1px 0;}
    .tag-head{width:100%;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;text-align:left;background:transparent;transition:background .15s;cursor:pointer;border:none;}
    .tag-head:hover{background:#f8fafc;}
    .tag-head-1{font-weight:600;color:#0f172a;background:#fff7ed;}
    .tag-head-1:hover{background:#ffedd5;}
    .tag-head-2{font-weight:500;color:#334155;padding-left:20px;}
    .tag-caret{width:16px;height:16px;color:#94a3b8;transition:transform .2s;flex-shrink:0;transform:rotate(0deg);}
    .is-collapsed .tag-caret{transform:rotate(-90deg);}
    .tag-label{flex:0 0 auto;}
    .tag-meta{margin-left:4px;font-size:11px;color:#94a3b8;font-weight:400;}
    .tag-count{margin-left:auto;font-size:11px;color:#94a3b8;background:#f1f5f9;border-radius:999px;padding:1px 8px;font-weight:500;white-space:nowrap;}
    .tag-count.has{color:#c2410c;background:#ffedd5;}
    .tag-body{padding:1px 0;}
    .tag-body.collapsed,.tag-complaints.collapsed{display:none;}
    .tag-leaf{margin:1px 0;}
    .tag-leaf-head{width:100%;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 30px;border-radius:8px;cursor:pointer;background:transparent;transition:background .15s;text-align:left;border:none;}
    .tag-leaf-head:hover{background:#f8fafc;}
    .tag-dot{width:6px;height:6px;border-radius:50%;background:#f97316;flex-shrink:0;}
    .tag-caret-sm{width:13px;height:13px;color:#cbd5e1;}
    .tag-complaints{padding:6px 10px 10px 40px;display:flex;flex-direction:column;gap:6px;}
    .complaint-card{background:#f8fafc;border:1px solid #f1f5f9;border-left:3px solid #fdba74;border-radius:8px;padding:8px 10px;}
    .complaint-src{display:inline-block;font-size:10px;font-weight:600;color:#9a3412;background:#ffedd5;border-radius:4px;padding:1px 6px;margin-bottom:4px;}
    .complaint-text{font-size:12px;color:#475569;line-height:1.55;margin:0;}
    .cat-complaint-meta{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
    .cat-complaint-time{font-size:10.5px;color:#94a3b8;}
    .complaint-toolbar{display:flex;gap:6px;margin-bottom:8px;}
    .complaint-search{flex:1;min-width:0;padding:5px 9px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;color:#334155;background:#f8fafc;outline:none;box-sizing:border-box;}
    .complaint-search:focus{border-color:#fdba74;box-shadow:0 0 0 2px #fff7ed;background:#fff;}
    .complaint-sort{padding:5px 6px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;color:#334155;background:#fff;outline:none;cursor:pointer;}
    .complaint-list{display:flex;flex-direction:column;gap:6px;}
    .complaint-meta{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
    .complaint-time{font-size:10.5px;color:#94a3b8;}


    /* ===== 品类分析 三栏联动 ===== */
    .cat-split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:stretch;margin-bottom:28px;}
    @media(max-width:1024px){.cat-split{grid-template-columns:1fr;}}
    .cat-side{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 8px 28px rgba(15,23,42,.055);padding:14px;display:flex;flex-direction:column;height:720px;overflow:hidden;}
    .cat-tree{flex:1;overflow:auto;padding:2px 4px 10px;}
    .cat-node{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;padding:7px 10px;border-radius:8px;font-size:13px;color:#334155;transition:background .15s,color .15s,box-shadow .15s;line-height:1.3;}
    .cat-node:hover{background:#f8fafc;}
    .cat-node.active{background:#fff7ed;color:#c2410c;font-weight:600;box-shadow:inset 0 0 0 1px #fed7aa;}
    .cat-node-l1{font-weight:700;color:#0f172a;font-size:13.5px;margin:2px 0 6px;padding:9px 8px;}
    .cat-node-l2{padding:9px 10px;margin:10px 2px 0;font-weight:650;color:#334155;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px 10px 0 0;}
    .cat-node-l2:hover{background:#f1f5f9;}
    .cat-node-l2 + .cat-children{margin:0 2px 10px;padding:4px 5px 6px;background:#fff;border:1px solid #e2e8f0;border-top:0;border-radius:0 0 10px 10px;box-shadow:0 3px 10px rgba(15,23,42,.025);}
    .cat-node-l3{padding:9px 8px 9px 12px!important;margin:0;border-left:0!important;border-radius:7px;font-size:12.5px;color:#64748b;}
    .cat-node-l3 + .cat-node-l3{border-top:1px solid #f1f5f9;}
    .cat-node-l3:hover{background:#f8fafc;}
    .cat-node-l3.active{background:#fff7ed;color:#9a3412;box-shadow:inset 0 0 0 1px #fed7aa;}
    .cat-caret{width:18px;height:18px;flex-shrink:0;color:#64748b;display:inline-flex;align-items:center;justify-content:center;transition:transform .2s,background .15s;cursor:pointer;user-select:none;border-radius:4px;background:#f1f5f9;}
    .cat-caret:hover{background:#e2e8f0;color:#334155;}
    .cat-caret svg{width:14px;height:14px;}
    .cat-caret-collapsed{transform:rotate(-90deg);}
    .cat-dot-l1{width:8px;height:8px;border-radius:3px;background:#f97316;flex-shrink:0;}
    .cat-dot-l2{width:6px;height:6px;border-radius:50%;background:#fb923c;flex-shrink:0;margin-left:1px;}
    .cat-dot-l3{width:5px;height:5px;border-radius:50%;background:#cbd5e1;flex-shrink:0;margin-left:2px;}
    .cat-label{flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cat-meta{margin-left:6px;font-size:10px;color:#94a3b8;}
    .cat-badge{margin-left:auto;font-size:10.5px;color:#94a3b8;background:#f1f5f9;border-radius:999px;padding:1px 7px;font-weight:500;white-space:nowrap;}
    .cat-node.active .cat-badge{color:#c2410c;background:#ffedd5;}
    .cat-hidden{display:none;}
    .cat-detail-wrap{position:relative;min-width:0;height:720px;overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 8px 28px rgba(15,23,42,.055);padding:22px;}
    .cat-path{font-size:12px;color:#94a3b8;margin-bottom:10px;}
    .cat-sep{margin:0 4px;color:#cbd5e1;}
    .cat-detail-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid #eef2f7;margin-bottom:18px;}
    .cat-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .cat-live-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:650;border:1px solid #d1fae5;}
    .cat-live-badge:before{content:'';width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12);}
    .cat-detail-title{font-size:18px;font-weight:700;color:#0f172a;}
    .cat-detail-sub{font-size:12px;color:#94a3b8;margin-top:3px;}
    .cat-detail-stat{text-align:right;color:#94a3b8;font-size:12px;min-width:52px;}
    .cat-detail-stat-num{font-size:24px;font-weight:700;color:#f97316;display:block;line-height:1;}
    .cat-section-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#0f172a;margin-bottom:10px;}
    .cat-section-bar{width:3px;height:14px;border-radius:2px;background:#f97316;}
    .cat-section-bar-green{background:#10b981;}
    .cat-detail-body{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(300px,.82fr);gap:18px;align-items:stretch;}
    @media(max-width:1100px){.cat-detail-body{grid-template-columns:1fr;}}
    .cat-col{display:flex;flex-direction:column;gap:10px;min-width:0;}
    .cat-surface{border:1px solid #dfe6ee;background:#fff;border-radius:14px;padding:15px;min-height:442px;box-shadow:0 4px 14px rgba(15,23,42,.04);}
    .cat-ai-surface{background:linear-gradient(180deg,#fffaf6 0%,#fff 58%);border-color:#ffead7;}
    .cat-complaint{display:flex;gap:8px;background:#fff;border:1px solid #dfe6ee;border-left:3px solid #fdba74;border-radius:10px;padding:9px 10px;cursor:pointer;transition:background .15s,box-shadow .15s,border-color .15s;box-shadow:0 2px 7px rgba(15,23,42,.03);}
    .cat-complaint:hover{background:#fff;border-color:#fdba74;box-shadow:0 5px 14px rgba(249,115,22,.09);}
    .cat-complaint.expanded{background:#fff;border-color:#fed7aa;}
    .cat-complaint-top{background:#fff7ed;border-color:#fed7aa;border-left-color:#f97316;}
    .cat-complaint-top:hover{background:#fff;border-color:#f97316;}
    .cat-complaint-rank{font-size:10px;font-weight:700;color:#9a3412;background:#ffedd5;border-radius:5px;padding:2px 6px;height:fit-content;white-space:nowrap;}
    .cat-complaint-rank-top{color:#fff;background:#f97316;}
    .cat-complaint-body{min-width:0;flex:1;}
    .cat-complaint-meta{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
    .cat-complaint-time{font-size:10.5px;color:#94a3b8;}
    .complaint-text.summary{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;}
    .complaint-text.full{display:none;margin:4px 0 0;}
    .cat-complaint.expanded .complaint-text.summary{display:none;}
    .cat-complaint.expanded .complaint-text.full{display:block;}
    .cat-expand-hint{font-size:10.5px;color:#64748b;display:inline-flex;margin-top:3px;padding:0;border:0;background:transparent;cursor:pointer;}
    .cat-expand-hint:hover{color:#ea580c;}
    .cat-detail-button{align-self:center;flex:0 0 auto;border:1px solid #fed7aa;background:#fff7ed;color:#c2410c;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:650;cursor:pointer;transition:.15s;}
    .cat-detail-button:hover{background:#ffedd5;border-color:#fb923c;}
    .complaint-detail-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,42,.46);backdrop-filter:blur(3px);}
    .complaint-detail-modal.is-hidden{display:none;}
    .complaint-detail-dialog{width:min(940px,96vw);max-height:min(820px,90vh);display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(15,23,42,.28);overflow:hidden;}
    .complaint-detail-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-bottom:1px solid #e2e8f0;}
    .complaint-detail-header h2{margin:0;color:#0f172a;font-size:18px;font-weight:750;}
    .complaint-detail-close{width:34px;height:34px;border:0;border-radius:9px;background:#f1f5f9;color:#475569;font-size:22px;line-height:1;cursor:pointer;}
    .complaint-detail-close:hover{background:#e2e8f0;color:#0f172a;}
    .complaint-detail-content{padding:20px 22px;overflow:auto;}
    .complaint-detail-section+.complaint-detail-section{margin-top:20px;}
    .complaint-detail-section h3{margin:0 0 10px;color:#334155;font-size:14px;font-weight:700;}
    .complaint-detail-table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:10px;}
    .complaint-detail-table{width:100%;border-collapse:collapse;font-size:13px;}
    .complaint-detail-table th,.complaint-detail-table td{padding:10px 12px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top;word-break:break-word;}
    .complaint-detail-table tr:last-child th,.complaint-detail-table tr:last-child td{border-bottom:0;}
    .complaint-detail-table th{width:160px;background:#f8fafc;color:#64748b;font-weight:600;white-space:nowrap;}
    .qa-table th{background:#fff7ed;color:#c2410c;}
    .qa-answer{display:flex;flex-direction:column;gap:4px;}
    .qa-answer-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11px;color:#94a3b8;}
    .qa-answer-meta b{color:#334155;font-weight:650;}
    .qa-answer-meta em{font-style:normal;background:#fff7ed;border:1px solid #ffedd5;color:#c2410c;border-radius:999px;padding:1px 8px;}
    .qa-answer p{margin:0;font-size:13px;color:#1e293b;line-height:1.7;}
    .qa-preview{display:flex;flex-direction:column;gap:3px;}
    .qa-preview-item{font-size:12px;color:#475569;line-height:1.55;padding:2px 0;}
    .qa-preview-item b{color:#c2410c;font-weight:650;}
    .qa-cell{max-width:280px;}
    .qa-card{margin-top:6px;padding:8px 10px;background:#f8fafc;border:1px solid #f1f5f9;border-radius:8px;}
    .complaint-detail-table td{color:#1e293b;line-height:1.65;}
    .complaint-detail-loading,.complaint-detail-error{padding:48px 20px;text-align:center;color:#64748b;}
    .complaint-detail-error{color:#b91c1c;}
    .cat-more{text-align:center;font-size:11px;color:#94a3b8;padding:6px;}
    .cat-suggest{display:flex;flex-direction:column;gap:8px;}
    .cat-suggest-item{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #e8edf3;border-radius:10px;padding:11px 12px;}
    .cat-suggest-num{width:20px;height:20px;flex-shrink:0;border-radius:50%;background:#10b981;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
    .cat-suggest-item p{margin:0;font-size:12.5px;color:#166534;line-height:1.55;}
    .ai-analyze-box{display:block;min-height:348px;margin-top:4px;padding:16px;background:rgba(255,255,255,.84);border:1px solid #ffead7;border-radius:12px;}
    .ai-capsule{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;font-size:13px;font-weight:650;color:#fff;background:#ea580c;border:1px solid #ea580c;border-radius:999px;padding:8px 16px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease;box-shadow:0 7px 18px rgba(234,88,12,.2);white-space:nowrap;}
    .ai-capsule:hover{background:#c2410c;border-color:#c2410c;transform:translateY(-1px);box-shadow:0 10px 22px rgba(194,65,12,.24);}
    .ai-capsule:focus-visible{outline:3px solid rgba(249,115,22,.22);outline-offset:3px;}
    .ai-capsule.analyzing{opacity:.72;cursor:wait;transform:none;box-shadow:none;}
    .ai-result-title{font-size:12px;font-weight:650;color:#9a3412;margin:16px 0 8px;text-transform:none;}
    .ai-result-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:#334155;line-height:1.65;}
    .ai-result-list li{position:relative;padding:10px 10px 10px 34px;background:#fff;border:1px solid #e8edf3;border-radius:10px;}
    .ai-result-list li:before{content:counter(list-item);position:absolute;left:10px;top:10px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:#fff1e6;color:#c2410c;font-size:10px;font-weight:700;}
    .ai-empty-state{min-height:314px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;color:#64748b;}
    .ai-empty-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#fff1e6;color:#ea580c;margin-bottom:12px;}
    .ai-empty-state strong{font-size:14px;color:#334155;margin-bottom:5px;}
    .ai-empty-state p{font-size:12px;line-height:1.6;max-width:240px;margin:0;}
    .ai-generated{display:none;}
    .ai-analyze-box.show .ai-empty-state{display:none;}
    .ai-analyze-box.show .ai-generated{display:block;animation:aiReveal .28s ease both;}
    .ai-conclusion{padding:13px 14px;border-radius:11px;background:#fff7ed;border-left:3px solid #f97316;color:#7c2d12;font-size:13px;line-height:1.7;}
    .ai-conclusion-label{display:block;color:#9a3412;font-size:11px;font-weight:700;letter-spacing:.06em;margin-bottom:4px;}
    @keyframes aiReveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .cat-ai-hint{font-size:12px;color:#94a3b8;margin:0 0 8px;}
    .ai-capsule-lg{font-size:13px;padding:6px 14px;}


    /* 搜索 / 操作 / 提示 / 热度图例 */
    .cat-search{position:relative;margin-bottom:12px;flex-shrink:0;}
    .cat-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#94a3b8;}
    .cat-search-input{width:100%;min-height:42px;padding:9px 10px 9px 34px;border:1px solid #e2e8f0;border-radius:11px;font-size:13px;color:#334155;background:#f8fafc;outline:none;transition:border .15s,box-shadow .15s;box-sizing:border-box;}
    .cat-search-input:focus{border-color:#fdba74;box-shadow:0 0 0 3px #fff7ed;background:#fff;}
    .cat-search-input::placeholder{color:#94a3b8;}
    .cat-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:#94a3b8;padding:8px 4px 2px;margin-top:4px;flex-shrink:0;}
    .cat-legend-bar{width:64px;height:6px;border-radius:3px;background:linear-gradient(90deg,#f59e0b,#f97316,#ef4444);}
    .cat-actions{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
    .cat-actions-hint{font-size:11px;color:#94a3b8;margin-left:2px;}
    .cat-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#475569;transition:all .15s;}
    .cat-btn:hover{background:#f8fafc;border-color:#cbd5e1;}
    .cat-btn-primary{background:#f97316;color:#fff;border-color:#f97316;}
    .cat-btn-primary:hover{background:#ea580c;border-color:#ea580c;}
    .cat-btn-marked{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}

  <script type="module">

const API_BASE='/api/v1';
const {buildBrandRiskAnalysis}=await import('./brand-risk-api.js');
const API_FILES={
  home:'dashboard/home',categoryDashboard:'analysis/category/dashboard',importOptions:'data-import/options',
  dashboards:{"production":"analysis/production/dashboard","parts":"analysis/parts/dashboard","function":"analysis/function/dashboard","customer":"analysis/customer/dashboard","lifecycle":"analysis/lifecycle/dashboard","orders":"analysis/orders/dashboard","semantic":"analysis/semantic/dashboard","brand":"analysis/brand/dashboard"},
  complaints:{"category":"analysis/category/complaints","production":"analysis/production/complaints","parts":"analysis/parts/complaints","function":"analysis/function/complaints","customer":"analysis/customer/complaints","lifecycle":"analysis/lifecycle/complaints","orders":"analysis/orders/complaints","semantic":"analysis/semantic/complaints","brand":"analysis/brand/complaints"}
};
async function loadApiJson(file){
  const response=await fetch(API_BASE+'/'+file,{headers:{Accept:'application/json'}});
  if(!response.ok) throw new Error(file+'：HTTP '+response.status);
  const payload=await response.json();
  if(!payload||!payload.meta||!payload.data) throw new Error(file+'：响应必须包含 meta 和 data');
  return payload;
}
let API_DATA;
try{
  const [homeResponse,categoryResponse,importResponse,dashboardEntries,brandComplaintResponse,qaResponse]=await Promise.all([
    loadApiJson(API_FILES.home),
    loadApiJson(API_FILES.categoryDashboard),
    loadApiJson(API_FILES.importOptions),
    Promise.all(Object.entries(API_FILES.dashboards).map(async ([id,file])=>[id,(await loadApiJson(file)).data])),
    loadApiJson(API_FILES.complaints.brand),
    loadApiJson('qa/questions')
  ]);
  API_DATA={
    homeMonthData:homeResponse.data.months,
    categoryMonthSeries:categoryResponse.data.monthSeries,
    topCategories:categoryResponse.data.topProducts,
    categoryLevel1:categoryResponse.data.level1,
    categoryLevel2:categoryResponse.data.level2,
    analysisDashboardData:Object.fromEntries(dashboardEntries),
    tagData:{brand:brandComplaintResponse.data.tree},
    sourceTypes:importResponse.data.sourceTypes,
    qaQuestions:qaResponse.data.items||[],
    generatedAt:homeResponse.meta.generatedAt
  };
  API_DATA.brandRisk=buildBrandRiskAnalysis(API_DATA);
}catch(error){
  document.body.innerHTML='<main style="max-width:760px;margin:80px auto;padding:32px;font-family:system-ui;border:1px solid #fed7aa;border-radius:16px;background:#fff7ed;color:#7c2d12"><h1 style="margin-top:0;color:#9a3412">数据接口加载失败</h1><p>请确认 Flask 后端与 PostgreSQL 数据库已启动，然后刷新页面。</p><small>'+String(error.message||error)+'</small></main>';
  throw error;
}

const TAG_DATA = API_DATA.tagData;
async function loadComplaintDimension(id){
  if(TAG_DATA[id]) return TAG_DATA[id];
  const file=API_FILES.complaints[id];
  if(!file) throw new Error('未知客诉维度：'+id);
  TAG_DATA[id]=(await loadApiJson(file)).data.tree;
  return TAG_DATA[id];
}
const updatedElement=document.getElementById('lastUpdatedAt');
if(updatedElement) updatedElement.textContent=new Date(API_DATA.generatedAt).toLocaleString('zh-CN',{hour12:false});

    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

    // 根据客诉内容生成确定性演示时间（2026-07-16 ~ 2026-08-15）
    function cTime(c, salt){
      if(c&&c.time) return String(c.time).replace('T',' ').slice(0,16);
      const seed=(''+(c&&c.source||'')+(c&&c.text||'')+(salt||0)).split('').reduce((a,ch)=>(a*31+ch.charCodeAt(0))&&((a*31+ch.charCodeAt(0))>>>0),7);
      const base=new Date(2026,6,16);
      base.setDate(base.getDate()+(seed%31));
      const y=base.getFullYear(),m=base.getMonth()+1,d=base.getDate();
      const hh=(seed>>3)%24,mm=(seed>>7)%60;
      const p=n=>(n<10?'0':'')+n;
      return y+'-'+p(m)+'-'+p(d)+' '+p(hh)+':'+p(mm);
    }
    function cSummary(text, len){
      if(!len) len=34;
      if(!text || text.length<=len) return text||'';
      return text.slice(0,len)+'…';
    }
    function cProfile(c){
      if(c.profile) return c.profile;
      if(c._profile) return c._profile;
      const regs=[
        {re:/孕妈|宝妈|婴儿|宝宝|辅食|奶粉/i,name:'母婴用户'},
        {re:/老人|长辈|父母|爷爷|奶奶/i,name:'银发用户'},
        {re:/租房|宿舍|学生|独居|白领|办公/i,name:'租房/年轻白领'},
        {re:/送礼|礼物|年会|伴手礼/i,name:'礼赠用户'},
        {re:/健身|减脂|养生|健康/i,name:'健康人群'}
      ];
      for(const r of regs){ if(r.re.test(c.text||'')) return c._profile=r.name; }
      return c._profile='普通用户';
    }

    function tagPanel(dataKey, title, subtitle) {
      let _id = 0;
      function countLeaves(n){
        if(!n.children||!n.children.length) return 1;
        return n.children.reduce((s,c)=>s+countLeaves(c),0);
      }
      function renderNodes(nodes, depth){
        return nodes.map(n=>{
          const id='tn'+(++_id);
          const hasKids = n.children && n.children.length;
          if(hasKids){
            const collapsed = depth>=1;
            return `<div class="tag-group">
              <button type="button" class="tag-head ${depth===0?'tag-head-1':'tag-head-2'} ${collapsed?'is-collapsed':''}" onclick="__toggleTag('${id}')">
                <svg class="tag-caret" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 8l3 3 3-3"/></svg>
                <span class="tag-label">${esc(n.label)}</span>
                ${n.meta?`<span class="tag-meta">${esc(n.meta)}</span>`:''}
                <span class="tag-count">${countLeaves(n)}</span>
              </button>
              <div class="tag-body ${collapsed?'collapsed':''}" id="${id}">${renderNodes(n.children, depth+1)}</div>
            </div>`;
          } else {
            const cid=id+'c';
            const comps=(n.complaints||[]);
            return `<div class="tag-leaf">
              <button type="button" class="tag-leaf-head is-collapsed" onclick="__toggleTag('${cid}')">
                <span class="tag-dot"></span>
                <span class="tag-label">${esc(n.label)}</span>
                ${n.meta?`<span class="tag-meta">${esc(n.meta)}</span>`:''}
                <span class="tag-count ${comps.length?'has':''}">${comps.length} 条客诉</span>
                <svg class="tag-caret tag-caret-sm" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 8l3 3 3-3"/></svg>
              </button>
              <div class="tag-complaints collapsed" id="${cid}">
                ${comps.length?`
                <div class="complaint-toolbar">
                  <input class="complaint-search" placeholder="搜索本类客诉…" oninput="__leafSearch(this)" />
                  <select class="complaint-sort" onchange="__leafSort(this)">
                    <option value="time">按时间</option>
                    <option value="source">按来源</option>
                    <option value="default">默认</option>
                  </select>
                </div>`:''}
                <div class="complaint-list">
                  ${comps.map((c,i)=>`<div class="complaint-card" data-idx="${i}" data-time="${cTime(c,i)}" data-source="${esc(c.source)}" data-text="${esc(c.text)}"><div class="complaint-meta"><span class="complaint-src">${esc(c.source)}</span><span class="complaint-time">${cTime(c,i)}</span></div><p class="complaint-text">${esc(c.text)}</p></div>`).join('')}
                </div>
                ${comps.length>10?`<div class="cat-more">其余 ${comps.length-10} 条客诉已折叠</div>`:''}
              </div>
            </div>`;
          }
        }).join('');
      }
      const data = TAG_DATA[dataKey] || [];
      return `<div class="bg-white rounded-xl border border-slate-200 shadow-card p-5 mb-6">
        <div class="flex items-center justify-between mb-1">
          <h3 class="text-base font-semibold text-slate-900">${title}</h3>
          <div class="flex items-center gap-3 text-xs">
            <button type="button" class="text-slate-400 hover:text-brand-600 font-medium" onclick="__expandAll(this)">展开全部</button>
            <span class="text-slate-200">|</span>
            <button type="button" class="text-slate-400 hover:text-brand-600 font-medium" onclick="__collapseAll(this)">收起全部</button>
          </div>
        </div>
        ${subtitle?`<p class="text-xs text-slate-500 mb-4">${subtitle}</p>`:''}
        <div class="tag-tree">${renderNodes(data,0)}</div>
      </div>`;
    }

    function __toggleTag(id){
      const el=document.getElementById(id);
      if(!el) return;
      el.classList.toggle('collapsed');
      const head=el.previousElementSibling;
      if(head && head.classList.contains('tag-head')||head&&head.classList.contains('tag-leaf-head')) head.classList.toggle('is-collapsed');
    }
    function __expandAll(btn){
      const tree=btn.closest('.tag-tree');
      tree.querySelectorAll('.tag-body,.tag-complaints').forEach(e=>e.classList.remove('collapsed'));
      tree.querySelectorAll('.tag-head,.tag-leaf-head').forEach(e=>e.classList.remove('is-collapsed'));
    }
    function __collapseAll(btn){
      const tree=btn.closest('.tag-tree');
      tree.querySelectorAll('.tag-body').forEach(e=>e.classList.add('collapsed'));
      tree.querySelectorAll('.tag-complaints').forEach(e=>e.classList.add('collapsed'));
      tree.querySelectorAll('.tag-head,.tag-leaf-head').forEach(e=>e.classList.add('is-collapsed'));
    }

    window.__leafSearch=function(input){
      const box=input.closest('.tag-complaints');
      const q=input.value.trim().toLowerCase();
      box.querySelectorAll('.complaint-card').forEach(function(card){
        const hay=(card.dataset.text+' '+card.dataset.source).toLowerCase();
        card.style.display=(!q||hay.indexOf(q)>=0)?'':'none';
      });
    };
    window.__leafSort=function(sel){
      const box=sel.closest('.tag-complaints');
      const list=box.querySelector('.complaint-list');
      if(!list) return;
      const cards=Array.prototype.slice.call(list.querySelectorAll('.complaint-card'));
      const mode=sel.value;
      cards.sort(function(a,b){
        if(mode==='time') return a.dataset.time<b.dataset.time?1:-1;
        if(mode==='source') return a.dataset.source<b.dataset.source?-1:1;
        return (+a.dataset.idx)-(+b.dataset.idx);
      });
      cards.forEach(function(c){ list.appendChild(c); });
    };


    // ===== 品类分析：三栏联动（左树 + 右详情） =====
    function catCollect(node){
      if(node.complaints && node.complaints.length) return node.complaints.slice();
      if(node.children) return node.children.flatMap(catCollect);
      return [];
    }
    function catCount(node){
      if(!node.children || !node.children.length) return 1;
      return node.children.reduce((s,c)=>s+catCount(c),0);
    }
    function catNode(data,a,b,c){
      const l1=data[+a]; if(!l1) return null;
      if(b===undefined) return l1;
      const l2=l1.children[+b]; if(!l2) return l1;
      if(c===undefined) return l2;
      return l2.children[+c] || l2;
    }
    function catSuggestions(node){
      const text=catCollect(node).map(c=>c.text).join(' ');
      const map=[
        {kw:['噪音','噪声'], s:'优化电机与减震结构，推出静音版本并附降噪使用指引'},
        {kw:['异味','塑料味','味道'], s:'改用食品级接触材质，加强新机通风与「首次使用」清洗指引'},
        {kw:['涂层','掉漆','脱落','掉皮'], s:'升级食品级不粘涂层，强化内胆来料检验与盐雾测试'},
        {kw:['漏水','渗水','漏'], s:'优化密封圈与卡扣结构，增加气密性全检工位'},
        {kw:['加热','不匀','慢','温'], s:'校准温控曲线与加热功率，优化导热结构一致性'},
        {kw:['灵敏','失灵','不工作','不开机','无反应'], s:'强化电路与触控模块可靠性验证，更新老化测试标准'},
        {kw:['清洗','难洗','难清理'], s:'优化可拆卸结构与防粘设计，配套专用清洁工具'},
        {kw:['生锈','腐蚀'], s:'升级不锈钢牌号或增加防锈涂层，完善潮湿环境适配'}
      ];
      const found=[];
      map.forEach(m=>{ if(m.kw.some(k=>text.includes(k))) found.push(m.s); });
      if(!found.length){ found.push('建立该品类高频问题快速响应话术与退换货绿色通道','推动供应链与设计端改进，纳入下季度质量提升专项'); }
      if(found.length===1){ found.push('将典型客诉沉淀为质检与客服知识库案例，定期复盘'); }
      return found.slice(0,3);
    }
    function catRenderDetail(node,path){

              <span class="cat-live-badge">数据已更新</span>

          </div>
          <div class="flex items-center gap-3">
            <button type="button" class="ai-capsule ai-capsule-lg" data-label="${esc(node.label)}" onclick="__catAiAnalyze(this)" aria-controls="aiAnalyzeBox">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18Z"/><path d="M9.8 15.9 9 18.7l-.8-2.8a4.5 4.5 0 0 0-3.1-3.1L2.3 12l2.8-.8a4.5 4.5 0 0 0 3.1-3.1L9 5.3l.8 2.8a4.5 4.5 0 0 0 3.1 3.1l2.8.8-2.8.8a4.5 4.5 0 0 0-3.1 3.1Z"/></svg>
              AI 智能分析
            </button>
            <div class="cat-detail-stat"><span class="cat-detail-stat-num">${comps.length}</span>条客诉</div>
          </div>
        </div>
        <div class="cat-detail-body">
          <section class="cat-col cat-surface" aria-labelledby="complaintSampleTitle">

                <div class="cat-filter-tabs" role="group" aria-label="筛选维度">

                  <button type="button" class="cat-filter-tab" data-filter="time" aria-pressed="false" onclick="__catSetFilter('time',this)">时间</button>

                </div>
                <span class="cat-filter-meta" id="catFilterCount">${comps.length} 条结果</span>
              </div>
              <div class="cat-filter-search-row">
                <div class="cat-filter-input-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3-3"/></svg>
                  <label class="sr-only" for="catFilterInput">搜索客诉</label>
                  <input id="catFilterInput" class="cat-filter-input" placeholder="搜索客诉内容、时间或客户画像" oninput="__catFilterComplaints()" />

                <button type="button" class="cat-quick-filter" data-type="profile" data-value="健康人群" onclick="__catApplyQuick('profile','健康人群',this)">健康人群</button>
              </div>
            </div>
            <div class="cat-complaints" id="catComplaintList">
              ${visible.map((c,idx)=>`
                <div class="cat-complaint ${idx===0?'cat-complaint-top':''}" data-id="${c.id}" data-idx="${idx}" data-time="${cTime(c,idx)}" data-profile="${esc(cProfile(c))}" onclick="__catExpandComplaint(this)">
                  <div class="cat-complaint-rank ${idx===0?'cat-complaint-rank-top':''}">${idx===0?'最高':'#'+(idx+1)}</div>

                  </div>
                  <button type="button" class="cat-detail-button" onclick="event.stopPropagation();__openComplaintDetail(${c.id})">详情</button>
                </div>`).join('')}
              ${folded.length?`<div class="cat-fold-toggle" id="catFoldToggle" onclick="__catToggleFold(this)">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 8l3 3 3-3"/></svg>
                <span>其余 ${folded.length} 条客诉已折叠</span>
              </div>
              <div class="cat-complaints-folded" id="catFoldedList">
                ${folded.map((c,idx)=>`
                <div class="cat-complaint" data-id="${c.id}" data-idx="${idx+3}" data-time="${cTime(c,idx+3)}" data-profile="${esc(cProfile(c))}" onclick="__catExpandComplaint(this)">
                  <div class="cat-complaint-rank">#${idx+4}</div>
                  <div class="cat-complaint-body">
                    <div class="cat-complaint-meta">
                      <span class="complaint-src">${esc(c.source)}</span>
                      <span class="cat-complaint-time">${cTime(c,idx+3)} · ${esc(cProfile(c))}</span>
                    </div>
                    <p class="complaint-text summary">${esc(cSummary(c.text))}</p>
                    <p class="complaint-text full">${esc(c.text)}</p>
                    <button type="button" class="cat-expand-hint" onclick="event.stopPropagation();__catExpandComplaint(this.closest('.cat-complaint'))">展开</button>

    window.__catAiAnalyze=async function(btn){
      if(btn.classList.contains('analyzing')) return;
      const box=document.getElementById('aiAnalyzeBox');
      const list=document.getElementById('aiResultList');
      const conclusion=document.getElementById('aiConclusion');
      const empty=document.getElementById('aiEmptyState');
      if(!box||!list||!conclusion||!empty) return;
      const ids=Array.from(new Set(
        Array.from(document.querySelectorAll('#catComplaintList .cat-complaint[data-id]'))
          .map(item=>Number(item.dataset.id))
          .filter(Number.isInteger)
      )).slice(0,200);
      if(!ids.length){showToast('当前节点没有可分析的客诉');return;}

      const original=btn.innerHTML;
      let succeeded=false;
      btn.classList.add('analyzing');
      btn.disabled=true;
      box.classList.remove('show');
      empty.innerHTML='<span class="ai-empty-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8" stroke-dasharray="12 8"/></svg></span><strong>MiMo 正在聚合客诉样本</strong><p>识别共性问题、风险与改善优先级，请稍候…</p>';
      btn.textContent='AI 分析中…';
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),120000);
      try{
        const response=await fetch('/api/analysis/insights',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({label:btn.dataset.label||'当前客诉集合',dataset_info_ids:ids}),
          signal:controller.signal
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(data.error||('HTTP '+response.status));
        conclusion.textContent=data.conclusion;
        list.innerHTML=(data.suggestions||[]).map(item=>'<li>'+esc(item)+'</li>').join('');
        box.classList.add('show');
        btn.textContent='已生成分析';
        empty.innerHTML='<strong>MiMo 分析完成</strong><p>已聚合 '+data.sample_count+' 条真实客诉。</p>';
        showToast('MiMo AI 洞察已生成');
        succeeded=true;
      }catch(error){
        const message=error.name==='AbortError'?'AI 分析超时，请稍后重试':String(error.message||error);
        empty.innerHTML='<strong>AI 分析失败</strong><p>'+esc(message)+'</p>';
        showToast(message);
      }finally{
        clearTimeout(timeout);
        btn.classList.remove('analyzing');
        btn.disabled=false;
        if(!succeeded) btn.innerHTML=original;
      }
    };

    function initBrandRiskCenter(){
      const root=document.getElementById('brandRiskCenter');if(!root)return;const data=API_DATA.brandRisk,toast=root.querySelector('#brandRiskToast');let timer;
      const notify=message=>{toast.textContent=message;toast.classList.add('is-visible');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('is-visible'),2200);};
      const showView=name=>{root.querySelectorAll('[data-br-tab]').forEach(tab=>tab.setAttribute('aria-selected',String(tab.dataset.brTab===name)));root.querySelectorAll('[data-br-view]').forEach(view=>view.classList.toggle('is-active',view.dataset.brView===name));};
      function renderQuestions(list){
        const overview=root.querySelector('#brOverviewQuestions');
        const body=root.querySelector('#brQuestionsBody');
        const moreBody=root.querySelector('#brQuestionsMore');
        const fold=root.querySelector('#brQuestionsFold');
        const foldText=root.querySelector('#brQuestionsFoldText');
        if(overview) overview.innerHTML=list.slice(0,3).map(brQuestionCard).join('');
        if(body) body.innerHTML=list.slice(0,BR_QUESTION_SHOW_LIMIT).map(brQuestionRow).join('');
        if(moreBody) moreBody.innerHTML=list.slice(BR_QUESTION_SHOW_LIMIT).map(brQuestionRow).join('');
        if(fold){
          fold.style.display=moreBody&&moreBody.innerHTML?'':'none';
          fold.setAttribute('aria-expanded','false');
          if(foldText) foldText.textContent='展开全部问大家内容';
          if(moreBody) moreBody.classList.remove('is-open');
        }
      }
      function applyFilter(){
        const period=root.querySelector('#brFilterPeriod')&&root.querySelector('#brFilterPeriod').value||'近30天';
        const category=root.querySelector('#brFilterCategory')&&root.querySelector('#brFilterCategory').value||'全部品类';
        const platform=root.querySelector('#brFilterPlatform')&&root.querySelector('#brFilterPlatform').value||'全部平台';
        const status=root.querySelector('#brFilterStatus');
        const days={'近7天':7,'近30天':30,'本季度':90}[period]||30;
        const allTimes=data.questions.map(q=>q.time?Date.parse(String(q.time).replace(' ','T')):0).filter(Boolean);
        const ref=allTimes.length?Math.max.apply(null,allTimes):Date.now();
        const cutoff=ref-days*86400000;
        const list=data.questions.filter(q=>{
          if(category!=='全部品类'&&!String(q.context||'').includes(category)) return false;
          if(platform!=='全部平台'&&String(q.signal||'').indexOf(platform)<0) return false;
          const t=q.time?Date.parse(String(q.time).replace(' ','T')):null;
          if(t&&t<cutoff) return false;
          return true;
        });
        renderQuestions(list);
        if(status) status.textContent='查询结果：'+list.length+' 条 · '+category+(platform==='全部平台'?'':' / '+platform)+(period==='近30天'?'':' / '+period);
        notify('查询完成，共 '+list.length+' 条用户问题');
      }
      function runAnalysis(){
        const list=data.questions;
        const bySignal={},byContext={};
        list.forEach(q=>{bySignal[q.signal]=(bySignal[q.signal]||0)+1;byContext[q.context]=(byContext[q.context]||0)+1;});
        const signals=Object.entries(bySignal).sort((a,b)=>b[1]-a[1]);
        const contexts=Object.entries(byContext).sort((a,b)=>b[1]-a[1]);
        const hot=[...list].sort((a,b)=>(b.repeatCount||0)-(a.repeatCount||0)).slice(0,3);
        const topSignal=signals[0]?signals[0][0]:'—';
        const topContext=contexts[0]?contexts[0][0]:'—';
        const totalSignals=list.reduce((sum,q)=>sum+(q.repeatCount||0),0);

    // 暖色分类色：品牌橙、杏色、珊瑚、金色、陶土与暖玫瑰。
    const DOUGHNUT_PALETTE=['#EA580C','#F28E2B','#F6B26B','#E76F51','#E9C46A','#C97A40'];
    const directDoughnutLabels={
      id:'directDoughnutLabels',
      defaults:{display:true},
      afterDatasetsDraw(chart,args,options){
        if(chart.config.type!=='doughnut'||options.display===false) return;
        const dataset=chart.data.datasets[0];
        const meta=chart.getDatasetMeta(0);
        const total=dataset.data.reduce((sum,value)=>sum+Number(value||0),0);
        const groups={left:[],right:[]};
        meta.data.forEach(function(arc,index){
          const value=Number(dataset.data[index]||0);
          if(!value||!arc) return;
          const angle=(arc.startAngle+arc.endAngle)/2;
          const side=Math.cos(angle)>=0?1:-1;
          const startRadius=arc.outerRadius-1;
          const elbowRadius=arc.outerRadius+12;
          const item={
            side,
            startX:arc.x+Math.cos(angle)*startRadius,
            startY:arc.y+Math.sin(angle)*startRadius,
            elbowX:arc.x+Math.cos(angle)*elbowRadius,
            elbowY:arc.y+Math.sin(angle)*elbowRadius,
            labelX:side>0?chart.width-14:14,
            label:String(chart.data.labels[index]||''),
            percent:Math.round(value/total*100)+'%',
            color:Array.isArray(dataset.backgroundColor)?dataset.backgroundColor[index]:'#F28E2B'
          };
          groups[side>0?'right':'left'].push(item);
        });
        const minY=chart.chartArea.top+12;
        const maxY=chart.chartArea.bottom-12;
        const gap=chart.width<420?24:28;
        Object.values(groups).forEach(function(items){
          items.sort((a,b)=>a.elbowY-b.elbowY);
          items.forEach(function(item,index){ item.labelY=Math.max(item.elbowY,index?items[index-1].labelY+gap:minY); });
          if(items.length&&items[items.length-1].labelY>maxY){
            const shift=items[items.length-1].labelY-maxY;
            items.forEach(item=>item.labelY-=shift);
            for(let i=items.length-2;i>=0;i--) items[i].labelY=Math.min(items[i].labelY,items[i+1].labelY-gap);
          }
        });
        const ctx=chart.ctx;
        const fontSize=chart.width<420?9.5:11;
        ctx.save();
        ctx.lineCap='round';
        ctx.lineJoin='round';
        [...groups.left,...groups.right].forEach(function(item){
          const lineEndX=item.labelX-item.side*(chart.width<420?58:76);
          ctx.beginPath();
          ctx.moveTo(item.startX,item.startY);
          ctx.lineTo(item.elbowX,item.elbowY);
          ctx.lineTo(lineEndX,item.labelY);
          ctx.strokeStyle=item.color;
          ctx.lineWidth=1.7;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(item.startX,item.startY,2.4,0,Math.PI*2);
          ctx.fillStyle=item.color;
          ctx.fill();
          ctx.textAlign=item.side>0?'right':'left';
          ctx.textBaseline='middle';
          ctx.fillStyle='#334155';
          ctx.font='650 '+fontSize+'px "Noto Sans SC", "PingFang SC", sans-serif';
          ctx.fillText(item.label,item.labelX,item.labelY-fontSize*.58);
          ctx.fillStyle='#0f172a';
          ctx.font='750 '+fontSize+'px Inter, "Noto Sans SC", sans-serif';
          ctx.fillText(item.percent,item.labelX,item.labelY+fontSize*.72);
        });
        ctx.restore();
      }
    };

          },

        });

    }

          type: 'bar',

    function initBrandCharts() {
      const campCtx = document.getElementById('brandCampaignChart');
      if (campCtx) {
        newChart(campCtx, {
          type: 'line',
          data: {
            labels: ['618预热','618爆发','618返场','日常','新品首发','七夕活动'],

          },
          options: commonOptions()
        });
      }
      const chCtx = document.getElementById('brandChannelChart');
      if (chCtx) {
        newChart(chCtx, {
          type: 'bar',
          data: {
            labels: ['京东','天猫','抖音','拼多多','小红书'],
            datasets: [
              { label: '好评', data: [82,79,75,70,88], backgroundColor: '#10b981', borderRadius: 4 },
              { label: '差评', data: [18,21,25,30,12], backgroundColor: '#ef4444', borderRadius: 4 }
            ]
          },
          options: { ...commonOptions(), scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, max: 100, grid: { color: '#f1f5f9' } } } }
        });
      }
    }

    const sourceTypes = API_DATA.sourceTypes;

    function renderTypeChips(source) {
      const container = document.getElementById('typeChipsRow');
      if (!container) return;
      const types = sourceTypes[source] || [];
      const labelHtml = '<span class="chip-row-label">数据类型</span>';
      if (types.length === 0) {
        container.innerHTML = labelHtml;
        container.classList.add('hidden');
        return;
      }
      container.classList.remove('hidden');
      const html = types.map((t, i) => `<button class="chip ${i === 0 ? 'chip-active' : ''}" data-type="${t}"><span class="chip-dot"></span>${t}</button>`).join('');
      container.innerHTML = labelHtml + html;
    }

    function initDataImportChips() {
      const sourceRow = document.getElementById('sourceChips');
      if (!sourceRow) return;
      const guidance=document.getElementById('importGuidance');
      if(guidance) guidance.innerHTML='<h3 class="text-base font-semibold text-slate-900 mb-4">导入说明</h3><ol class="space-y-3 text-sm text-slate-600 list-decimal pl-5"><li>仅支持 .xlsx 文件。</li><li>模板可使用两行表头：第一行中文说明，第二行数据库英文字段名。</li><li>至少提供商品 ID 与客户评价；系统会从商品目录补齐 SKU 和品类。</li><li>导入完成后点击右上角“新建分析”生成分析标签。</li></ol>';
      const initialSource = sourceRow.querySelector('.chip-active')?.dataset.source || '京东';
      renderTypeChips(initialSource);

      sourceRow.addEventListener('click', e => {
        const chip = e.target.closest('.chip[data-source]');
        if (!chip) return;
        sourceRow.querySelectorAll('.chip[data-source]').forEach(c => c.classList.remove('chip-active'));
        chip.classList.add('chip-active');
        renderTypeChips(chip.dataset.source);
      });

      document.addEventListener('click', e => {
        const chip = e.target.closest('#typeChipsRow .chip[data-type]');
        if (!chip) return;
        document.querySelectorAll('#typeChipsRow .chip[data-type]').forEach(c => c.classList.remove('chip-active'));
        chip.classList.add('chip-active');
      });
    }

    function initParseButton() {
      const parseBtn=document.getElementById('parseDataBtn');
      const resultPanel=document.getElementById('parsingResult');
      const fileInput=document.getElementById('importFileInput');
      const dropZone=document.getElementById('importDropZone');
      const chooseBtn=document.getElementById('chooseImportFileBtn');
      const fileName=document.getElementById('importFileName');
      if(!parseBtn||!resultPanel||!fileInput||!dropZone||!chooseBtn) return;

      const setFileName=()=>{if(fileName&&fileInput.files[0])fileName.textContent=fileInput.files[0].name;};
      chooseBtn.addEventListener('click',event=>{event.stopPropagation();fileInput.click();});
      dropZone.addEventListener('click',()=>fileInput.click());
      fileInput.addEventListener('change',setFileName);
      dropZone.addEventListener('dragover',event=>{event.preventDefault();dropZone.classList.add('border-brand-400');});
      dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('border-brand-400'));
      dropZone.addEventListener('drop',event=>{
        event.preventDefault();
        dropZone.classList.remove('border-brand-400');
        const file=event.dataTransfer.files[0];
        if(file){
          const transfer=new DataTransfer();
          transfer.items.add(file);
          fileInput.files=transfer.files;
          setFileName();
        }
      });

      parseBtn.addEventListener('click',async()=>{
        const file=fileInput.files[0];
        if(!file){showToast('请先选择 .xlsx 文件');return;}
        parseBtn.textContent='正在导入…';
        parseBtn.disabled=true;
        try{
          const form=new FormData();
          form.append('file',file);
          const response=await fetch('/api/dataset/import',{method:'POST',body:form});
          const data=await response.json();
          if(!response.ok) throw new Error(data.error||'导入失败');
          const errors=data.errors||[];
          resultPanel.innerHTML=`<div class="p-6"><h3 class="text-base font-semibold text-slate-900 mb-3">导入完成</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="p-3 bg-emerald-50 rounded-lg"><div class="text-xs text-emerald-700">成功导入</div><strong class="text-xl text-emerald-800">${data.imported}</strong></div><div class="p-3 bg-slate-50 rounded-lg"><div class="text-xs text-slate-600">读取总数</div><strong class="text-xl">${data.total}</strong></div><div class="p-3 bg-amber-50 rounded-lg"><div class="text-xs text-amber-700">异常记录</div><strong class="text-xl text-amber-800">${errors.length}</strong></div><div class="p-3 bg-blue-50 rounded-lg"><div class="text-xs text-blue-700">目录匹配</div><strong class="text-xl text-blue-800">${data.catalog_matched||0}</strong></div></div>${errors.length?`<div class="mt-4 text-sm text-rose-700">${errors.slice(0,10).map(item=>'第 '+item.row+' 行：'+esc(item.error)).join('<br>')}</div>`:''}</div>`;
          resultPanel.style.display='';
          resultPanel.scrollIntoView({behavior:'smooth',block:'nearest'});
          showToast(`成功导入 ${data.imported} 条客诉`);
        }catch(error){
          showToast(String(error.message||error));
        }finally{
          parseBtn.textContent='导入数据';
          parseBtn.disabled=false;
        }
      });
    }

    function setCategoryHeaderView(active){
      const extra=document.getElementById('moduleHeaderExtra');
      if(!extra) return;
      if(!active){ extra.innerHTML=''; return; }
      extra.innerHTML='<div class="module-view-tabs" aria-label="品类分析视图"><button class="module-view-tab '+(active==='dashboard'?'active':'')+'" type="button" onclick="__showCategoryDashboard()">数据看板</button><button class="module-view-tab '+(active==='detail'?'active':'')+'" type="button" onclick="__showCategoryDetail()">客诉明细</button></div>';
    }
    function setAnalysisHeaderView(id,active){
      const extra=document.getElementById('moduleHeaderExtra');
      if(!extra) return;
      const title=ANALYSIS_DASHBOARD_DATA[id].title;
      extra.innerHTML='<div class="module-view-tabs" aria-label="'+title+'视图"><button class="module-view-tab '+(active==='dashboard'?'active':'')+'" type="button" onclick="__showAnalysisDashboard(\''+id+'\')">数据看板</button><button class="module-view-tab '+(active==='detail'?'active':'')+'" type="button" onclick="__showAnalysisDetail(\''+id+'\')">客诉明细</button></div>';
    }
    function initLegacyAnalysisModule(id){
      if(id==='production') initProductionCharts();
      if(id==='parts') initPartsCharts();
      if(id==='function') initFunctionCharts();
      if(id==='customer') initCustomerCharts();
      if(id==='lifecycle') initLifecycleChart();
      if(id==='orders') initOrderChart();
      if(id==='semantic') initSemanticCharts();
      if(id==='brand') initBrandCharts();
    }

    function renderModule(moduleId) {
      const mod = modules[moduleId];
      if (!mod) return;

      document.getElementById('pageTitle').textContent = mod.title;
      document.getElementById('breadcrumbCurrent').textContent = mod.breadcrumb;
      if(moduleId==='category') setCategoryHeaderView('dashboard');
      else if(ANALYSIS_MODULE_IDS.includes(moduleId)) setAnalysisHeaderView(moduleId,'dashboard');
      else setCategoryHeaderView('');
      document.getElementById('moduleContent').innerHTML = mod.render();
      destroyCharts();

      if (moduleId === 'home') { initHomeBrandCharts(DEFAULT_MONTH); initHomeCharts(DEFAULT_MONTH); }
      if (moduleId === 'category') initCategoryDashboardCharts(DEFAULT_MONTH);
      if (ANALYSIS_MODULE_IDS.includes(moduleId)) { window.__activeAnalysisModule=moduleId; initAnalysisDashboardCharts(moduleId,DEFAULT_MONTH); }
      if (moduleId === 'data-import') {
        initDataImportChips();
        initParseButton();
      }
      if (moduleId === 'brand-risk') initBrandRiskCenter();
    }

    window.__navigateModule=function(moduleId){
      document.querySelectorAll('.nav-item').forEach(function(item){ item.classList.toggle('active',item.dataset.module===moduleId); });
      renderModule(moduleId);
      window.scrollTo({top:0,behavior:'smooth'});
      if(window.innerWidth<1024){ document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebarOverlay').classList.add('hidden'); }
    };
    window.__showCategoryDashboard=function(){
      renderModule('category');
      window.scrollTo({top:0,behavior:'smooth'});
    };
    window.__showAnalysisDashboard=function(id){
      renderModule(id);
      window.scrollTo({top:0,behavior:'smooth'});
    };
    window.__showAnalysisDetail=async function(id,tag){
      const config=ANALYSIS_DASHBOARD_DATA[id];
      if(!config) return;
      try{await loadComplaintDimension(id);}catch(error){showToast(String(error.message||error));return;}
      window.__activeAnalysisModule=id;
      document.getElementById('pageTitle').textContent=config.title;
      document.getElementById('breadcrumbCurrent').textContent=config.title+' / 客诉明细';
      setAnalysisHeaderView(id,'detail');
      document.getElementById('moduleContent').innerHTML=categoryPanel(id);
      destroyCharts();
      initCategoryPanel();
      if(tag){
        const search=document.getElementById('catSearch');
        if(search){ search.value=tag; search.dispatchEvent(new Event('input',{bubbles:true})); }
        const target=Array.prototype.slice.call(document.querySelectorAll('.cat-node-l3')).find(function(node){ const label=node.querySelector('.cat-label'); return label&&label.textContent.trim()===tag; });
        if(target) target.click();
      }
      window.scrollTo({top:0,behavior:'smooth'});
    };
    window.__showCategoryDetail=async function(name){
      const selected=name||'';
      try{await loadComplaintDimension('category');}catch(error){showToast(String(error.message||error));return;}
      document.getElementById('pageTitle').textContent='品类分析';
      document.getElementById('breadcrumbCurrent').textContent='品类分析 / 客诉明细';
      setCategoryHeaderView('detail');
      document.getElementById('moduleContent').innerHTML=categoryPanel();
      destroyCharts();
      initCategoryPanel();
      if(selected){
        const search=document.getElementById('catSearch');
        if(search){ search.value=selected; search.dispatchEvent(new Event('input',{bubbles:true})); }
        const target=Array.prototype.slice.call(document.querySelectorAll('.cat-node-l3')).find(function(node){ const label=node.querySelector('.cat-label'); return label&&label.textContent.trim()===selected; });
        if(target) target.click();
      }
      window.scrollTo({top:0,behavior:'smooth'});
    };
    window.__openCategoryReport=function(name){
      window.__showCategoryDetail(name);
    };
    window.__openCategoryDetail=function(name){
      window.__showCategoryDetail(name);
    };

    // Sidebar nav
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const moduleId = btn.getAttribute('data-module');
        renderModule(moduleId);
        // Close mobile sidebar
        if (window.innerWidth < 1024) {
          document.getElementById('sidebar').classList.add('-translate-x-full');
          document.getElementById('sidebarOverlay').classList.add('hidden');
        }
      });
    });

    // Mobile sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    });

    document.getElementById('exportReportBtn')?.addEventListener('click',()=>{
      if(typeof XLSX==='undefined'){ showToast('Excel 导出组件加载失败，请检查网络后重试'); return; }
      try{
        const wb=XLSX.utils.book_new();
        const monthKeys=Object.keys(API_DATA.categoryMonthSeries||{}).sort();
        const sixKeys=monthKeys.slice(-6);
        const sixTotal=sixKeys.reduce((sum,key)=>sum+(API_DATA.categoryMonthSeries[key]||0),0);
        const trendSheet=[['月份','客诉量']];
        monthKeys.forEach(key=>trendSheet.push([key,(API_DATA.categoryMonthSeries[key]||0)]));
        const topSheet=[['排名','品类','客诉量','环比趋势']];
        (API_DATA.topCategories||[]).forEach((item,i)=>topSheet.push([i+1,item.name,item.count,item.trend]));
        const level1Sheet=[['一级品类','客诉量']];
        (API_DATA.categoryLevel1||[]).forEach(item=>level1Sheet.push([item.name,item.count]));
        const level2Sheet=[['二级品类','客诉量']];
        (API_DATA.categoryLevel2||[]).forEach(item=>level2Sheet.push([item.name,item.count]));
        const homeSheet=[['月份','客诉量','品类','品类客诉量','生产环节','生产环节客诉量','画像','画像客诉量','平台','平台客诉量']];
        Object.keys(API_DATA.homeMonthData||{}).sort().slice(-6).forEach(key=>{
          const m=API_DATA.homeMonthData[key]||{};
          homeSheet.push([key,m.total||0,(m.categoryLabels||[]).join('、'),(m.category||[]).join('、'),(m.productionLabels||[]).join('、'),(m.production||[]).join('、'),(m.profileLabels||[]).join('、'),(m.profile||[]).join('、'),(m.platformLabels||[]).join('、'),(m.platform||[]).join('、')]);
        });
        const questionSheet=[['用户问题','产品或维度','信号量','来源']];
        (API_DATA.brandRisk?.questions||[]).forEach(item=>questionSheet.push([item.question,item.context,item.repeatCount,item.signal]));
        const dimensionSheet=[['分析维度','二级分类','占比','标签','近6个月总量','最高二级分类']];
        Object.entries(API_DATA.analysisDashboardData||{}).forEach(([id,cfg])=>{
          dimensionSheet.push([cfg.title||id,(cfg.secondary||[]).join('、'),(cfg.shares||[]).join('、'),(cfg.tags||[]).join('、'),cfg.summary?.total||0,cfg.summary?.peakSecondary||'—']);
        });
        const sheets={概览:[['小熊电器客诉分析报告'],[],['导出时间',new Date().toLocaleString('zh-CN')],['数据生成时间',new Date(API_DATA.generatedAt).toLocaleString('zh-CN')],[],['近6个月客诉总量',sixTotal],['月份区间',sixKeys[0]+' ~ '+sixKeys[sixKeys.length-1]]],'月度客诉趋势':trendSheet,'品类TOP10':topSheet,'一级品类':level1Sheet,'二级品类':level2Sheet,'经营首页近6月':homeSheet,'问大家问题':questionSheet,'各维度看板':dimensionSheet};
        Object.entries(sheets).forEach(([name,rows])=>{
          const ws=XLSX.utils.aoa_to_sheet(rows);
          if(name==='概览'||name==='月度客诉趋势') ws['!cols']=[{wch:22},{wch:14}];
          else ws['!cols']=[{wch:24},{wch:16},{wch:14},{wch:18},{wch:18},{wch:14}];
          XLSX.utils.book_append_sheet(wb,ws,name);
        });
        XLSX.writeFile(wb,'客诉分析报告_'+DEFAULT_MONTH+'.xlsx');
        showToast('真实数据报告已导出为 Excel');
      }catch(error){
        showToast('导出失败：'+(error&&error.message||error));
      }
    });

    document.getElementById('runAnalysisBtn')?.addEventListener('click',async event=>{
      const button=event.currentTarget;
      if(button.disabled) return;
      const original=button.innerHTML;
      button.disabled=true;
      button.textContent='分析处理中…';
      try{
        const response=await fetch('/api/analysis/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:100})});
        const data=await response.json();
        if(!response.ok) throw new Error(data.error||'分析任务失败');
        showToast(`分析完成：成功 ${data.analyzed} 条，失败 ${data.failed} 条，剩余 ${data.remaining} 条`);
        if(data.analyzed>0) setTimeout(()=>location.reload(),1200);
      }catch(error){
        showToast(String(error.message||error));
      }finally{
        button.disabled=false;
        button.innerHTML=original;
      }
    });

    const globalSearch=document.querySelector('header input[placeholder*="搜索"]');
    globalSearch?.addEventListener('keydown',event=>{
      if(event.key!=='Enter') return;
      window.__showCategoryDetail();
      const detailSearch=document.getElementById('catSearch');
      if(detailSearch){detailSearch.value=globalSearch.value;detailSearch.dispatchEvent(new Event('input',{bubbles:true}));}
    });

    // Initial render
    renderModule('home');
  </script>
